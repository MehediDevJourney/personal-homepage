<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Hello, Mehedi!</h1>
  <p>Your personal Chrome home screen</p>
  <input type="text" id="searchInput" placeholder="Search / Open site...">
</header>
<main class="tiles">
  <div class="tile" data-url="https://www.facebook.com"><img src="assets/facebook.png" alt="Facebook"><span>Facebook</span></div>
  <div class="tile" data-url="https://chat.openai.com"><img src="assets/chatgpt.png" alt="ChatGPT"><span>ChatGPT</span></div>
  <div class="tile" data-url="https://drive.google.com"><img src="assets/drive.png" alt="Google Drive"><span>Drive</span></div>
  <div class="tile" data-url="https://photos.google.com"><img src="assets/photos.png" alt="Google Photos"><span>Photos</span></div>
  <div class="tile" data-url="https://web.telegram.org"><img src="assets/telegram.png" alt="Telegram"><span>Telegram</span></div>
  <div class="tile" data-url="https://deepseek.ai"><img src="assets/deepseek.png" alt="Deepseek"><span>Deepseek</span></div>
  <div class="tile" data-url="https://www.gemini.com"><img src="assets/gemini.png" alt="Gemini"><span>Gemini</span></div>
</main>
<script src="script.js"></script>
</body>
</html>
