<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://suggestqueries.google.com">
    <title>Mehedi's Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="themeToggle" aria-label="Toggle Theme">🌙</button>

    <div class="smart-widget">
        <div class="widget-header">
            <span id="widgetDate">Loading Date...</span>
            <span id="widgetBattery">🔋 --%</span>
        </div>
        <div id="widgetClock">00:00</div>
        <div class="widget-footer" id="greetingText">Hello, Mehedi!</div>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <input id="searchInput" type="text" autocomplete="off" spellcheck="false" />
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/></svg>
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>
        <ul id="suggestions"></ul>
    </div>

    <div class="main-apps-grid" id="mainAppsGrid">
        </div>

    <div class="bottom-dock-container">
        <div class="dock-apps" id="dockApps">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
