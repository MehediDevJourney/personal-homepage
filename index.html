<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace | Mehedi Hasan</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="top-bar">
        <div class="status-pill">
            <span id="widgetDate">Loading...</span>
            <span class="dot">•</span>
            <span id="widgetBattery">🔋 --%</span>
        </div>
        <button id="themeToggle" aria-label="Toggle Theme">🌙</button>
    </div>

    <div class="clock-widget">
        <h1 id="widgetClock">00:00</h1>
        <p id="greetingText">Hello, Mehedi!</p>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/></svg>
            <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search the web or type a URL..." autofocus />
            <button class="clear-btn" id="clearBtn">✕</button>
        </div>
        <ul id="suggestions"></ul>
    </div>

    <div class="premium-app-grid" id="mainAppsGrid">
        </div>

    <div class="daily-quote" id="dailyQuote">
        <p class="quote-text" id="quoteText">"Loading quote..."</p>
        <span class="quote-author" id="quoteAuthor">- Author</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
