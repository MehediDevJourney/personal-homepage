<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspace | Mehedi Hasan</title>
    
    <meta property="og:title" content="Workspace | Mehedi Hasan">
    <meta property="og:description" content="Personal digital workspace of Mehedi Hasan.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="main-wrapper">
        
        <div class="top-bar">
            <div class="status-pill glass-effect">
                <span id="widgetDate">Loading...</span>
                <span class="dot">•</span>
                <span id="widgetBattery">🔋 --%</span>
            </div>
            <button id="themeToggle" class="glass-effect" aria-label="Toggle Theme">🌙</button>
        </div>

        <div class="clock-widget">
            <h1 id="widgetClock">00:00</h1>
            <p id="greetingText">Hello, Mehedi!</p>
        </div>

        <div class="search-container">
            <div class="search-wrapper glass-effect">
                <svg class="search-icon" viewBox="0 0 24 24"><path d="M21.71,20.29,18,16.61A9,9,0,1,0,16.61,18l3.68,3.68a1,1,0,0,0,1.42,0A1,1,0,0,0,21.71,20.29ZM11,18a7,7,0,1,1,7-7A7,7,0,0,1,11,18Z"/></svg>
                <input id="searchInput" type="text" autocomplete="off" spellcheck="false" autofocus />
                <button class="clear-btn" id="clearBtn" aria-label="Clear Search">✕</button>
            </div>
            <ul id="suggestions"></ul>
        </div>

        <div class="premium-app-grid" id="mainAppsGrid">
            </div>

        <div class="daily-quote" id="dailyQuote">
            <p class="quote-text" id="quoteText">"Loading..."</p>
            <span class="quote-author" id="quoteAuthor">- Mehedi</span>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
